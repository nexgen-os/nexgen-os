[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgen-sharing-example"
version = "0.1.0"
description = "An example energy_sharing engine for Nexgen OS: one request as JSON on stdin, one result as JSON on stdout. Copy it and replace the key."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nexgen-sharing-example = "nexgen_sharing_example.__main__:main"

[tool.setuptools]
packages = ["nexgen_sharing_example"]
