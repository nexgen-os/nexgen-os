[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgen-settlement-example"
version = "0.3.0"
description = "An example settlement engine for Nexgen OS: one request as JSON on stdin, one result as JSON on stdout. Copy it and replace the price."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nexgen-settlement-example = "nexgen_settlement_example.__main__:main"

[tool.setuptools]
packages = ["nexgen_settlement_example"]
