[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgen-os"
version = "0.1.0"
description = "Read and describe a Nexgen OS installation from Python: the four readers of the model, and attributes attached with their source."
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["psycopg>=3.1"]

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.1"]

[tool.setuptools]
packages = ["nexgen_os"]
